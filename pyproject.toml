[project]
name = "quarry"
version = "0.1.0"
description = "A small SQL query engine over CSV files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martin Muskov" }]
dependencies = []

[project.scripts]
quarry = "quarry.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# The tools the tests and the lint gate need, in one place.
#
# Without this, `uv sync` installed nothing beyond the (empty) runtime
# dependencies and `uv run pytest` failed with "Failed to spawn: pytest" — the
# command the repository's own instructions tell you to run. CI worked because
# it named the same three tools again in a pip line, which is two lists that
# had no way of staying equal.
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
