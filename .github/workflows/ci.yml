name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor (matching requires-python) and the current release, on both
        # Linux and Windows. Windows matters because path handling for the
        # `name.csv` table resolution differs from POSIX.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tools
        run: python -m pip install --upgrade pip pytest ruff hypothesis
      # Lint gate. The project already declares a ruff config in pyproject;
      # this runs it so a violation fails the build rather than sitting unseen.
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
